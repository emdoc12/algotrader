name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  # The auto-fix workflow dispatches this explicitly: pushes made by
  # claude[bot] do NOT fire push-event workflows (observed: five bot releases,
  # zero image builds), so without this the pipeline's fixes never shipped
  # unless a human happened to push afterward.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/emdoc12/algotrader:latest
            ghcr.io/emdoc12/algotrader:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
